{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "s3gate.fullname" . }}
  labels:
    {{- include "s3gate.labels" . | nindent 4 }}
type: Opaque
stringData:
  S3GATE_ACCESS_KEY_ID: {{ .Values.credentials.accessKeyId | quote }}
  S3GATE_SECRET_ACCESS_KEY: {{ .Values.credentials.secretAccessKey | quote }}
  {{- with .Values.credentials.sessionToken }}
  S3GATE_SESSION_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
