# Default values for s3gate.
#
# The release namespace should enforce the restricted Pod Security Standard:
#   kubectl label namespace <ns> pod-security.kubernetes.io/enforce=restricted

replicaCount: 3

image:
  repository: ghcr.io/cytrinox/s3gate
  # Defaults to the chart's appVersion.
  tag: ""
  # Overrides tag when set, e.g. "sha256:...".
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

s3:
  # Required. Bucket to serve from.
  bucket: ""
  region: us-east-1
  # Key prefix all requests are confined to, e.g. "public/".
  prefix: ""
  # Custom endpoint for S3-compatible stores (MinIO, Ceph, R2, ...).
  endpoint: ""
  # Endpoint written into presigned URLs when clients reach S3 under a different address.
  publicEndpoint: ""
  forcePathStyle: false

credentials:
  # Name of an existing Secret with the keys S3GATE_ACCESS_KEY_ID and
  # S3GATE_SECRET_ACCESS_KEY (and optionally S3GATE_SESSION_TOKEN).
  # When set, the values below are ignored and no Secret is created.
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""
  sessionToken: ""

config:
  # Presigned URL lifetime in seconds (1-604800).
  presignTtl: 300
  # Query object metadata (HeadObject) before redirecting. Enables the early 404 for
  # missing objects and the object size for s3gate_approx_fetched_bytes_total.
  queryMetadata: true
  # Maximum time in seconds to handle one request (1-3600).
  requestTimeout: 30
  # Object key that must exist for the pod to report ready. Empty = always ready.
  readinessPathExists: ""
  # Timeout in seconds for the readiness check (1-60).
  readinessTimeout: 2
  # json or text
  logFormat: json
  # tracing filter, e.g. "info" or "s3gate=debug,info".
  logLevel: info

# URL overrides, evaluated before key mapping and any S3 call. Same format as an entry in
# overrides.yaml (see overrides.schema.json in the s3gate repository). Changes roll the pods.
#   - path: /
#     type: redirect            # redirect | notfound | content | nocontent
#     location: https://example.com/
#     status: 301               # 301 | 302 | 303 | 307 | 308, default 302
#     preserve_query: true
#   - path: /robots.txt
#     type: content
#     content_type: text/plain; charset=utf-8
#     body: |
#       User-agent: *
#       Disallow: /
#   - path: /private/
#     match: prefix             # exact (default) | prefix
#     type: notfound
overrides: []

# Additional environment variables for the container.
extraEnv: []

# Run the pod in a user namespace (requires Kubernetes >= 1.33 and runtime/kernel support).
hostUsers: false

serviceAccount:
  create: true
  # Defaults to the fullname when create is true, "default" otherwise.
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

# Liveness and startup never touch S3, so an S3 outage does not restart pods.
startupProbe:
  httpGet:
    path: /_s3gate/healthz
    port: http
  periodSeconds: 2
  failureThreshold: 15

livenessProbe:
  httpGet:
    path: /_s3gate/healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# timeoutSeconds must stay above config.readinessTimeout.
readinessProbe:
  httpGet:
    path: /_s3gate/readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Keep serving while endpoint removal propagates to ingresses before SIGTERM. 0 disables.
preStopSleepSeconds: 5

# Should exceed preStopSleepSeconds + config.requestTimeout.
terminationGracePeriodSeconds: 45

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Prometheus metrics on a separate port (GET /metrics).
metrics:
  enabled: false
  port: 9090
  # Path depth (0-10) for s3gate_fetches_total, which counts successful GET redirects
  # labelled level1..levelN and subpath. 0 disables it. Every distinct prefix becomes
  # its own series, so keep the level above the object names.
  fetchLevels: 0
  # Prometheus Operator ServiceMonitor; requires metrics.enabled.
  serviceMonitor:
    enabled: false
    # Namespace for the ServiceMonitor. Defaults to the release namespace.
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: false
    # Extra labels, e.g. to match the Prometheus serviceMonitorSelector.
    labels: {}
    metricRelabelings: []
    relabelings: []
  # Grafana dashboard (dashboards/s3gate-dashboard.json) as a ConfigMap for the Grafana
  # dashboard sidecar, e.g. from kube-prometheus-stack. Requires metrics.enabled.
  # The dashboard covers all s3gate deployments, so enable it in one release only.
  grafanaDashboard:
    enabled: false
    # Namespace for the ConfigMap, e.g. the one the sidecar watches. Defaults to the
    # release namespace.
    namespace: ""
    # Labels the sidecar selects on. kube-prometheus-stack uses grafana_dashboard: "1".
    labels:
      grafana_dashboard: "1"
    # E.g. a folder annotation, if the sidecar is configured with folderAnnotation.
    annotations: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

# Ingress and gateway (below) are independent: enable either, both, or neither.
# With traefik.middlewares.enabled, the Ingress automatically gets a
# traefik.ingress.kubernetes.io/router.middlewares annotation for the rendered middlewares.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: s3gate.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: s3gate-tls
  #    hosts:
  #      - s3gate.example.com

# Gateway API (gateway.networking.k8s.io/v1). The chart does not create a Gateway;
# it renders one HTTPRoute that attaches to an existing Gateway via parentRefs.
gateway:
  enabled: false
  parentRefs:
    # Required: name of the existing Gateway.
    - name: ""
      # Defaults to the release namespace.
      namespace: ""
      # A specific listener of the Gateway.
      sectionName: ""
      # port: 443
  hostnames:
    - s3gate.example.com
  annotations: {}
  # Path matches for the HTTPRoute. Default: everything.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Extra filters. Traefik middleware ExtensionRef filters are appended
      # automatically when traefik.middlewares.enabled is true.
      filters: []

# Traefik CRDs (traefik.io/v1alpha1).
traefik:
  # Routes the HTTPRoute through a weighted TraefikService instead of the Service
  # directly. Only affects gateway mode, not the Ingress.
  traefikService:
    enabled: false
    weighted:
      # Omitted from the spec when 0.
      weight: 1
      # Sticky cookies pin a client to one pod. s3gate keeps no per-pod state,
      # so this is usually not needed.
      sticky:
        enabled: false
        cookie:
          # Empty lets Traefik choose a name.
          name: s3gate_sticky
          # Set to false if the backend sees plain HTTP, or browsers drop the cookie.
          secure: true
          httpOnly: true
          # none | lax | strict. "none" requires secure.
          sameSite: lax
          # 0 = session cookie.
          maxAge: 0
          path: ""
          domain: ""

  # Renders one Middleware per enabled section and attaches them to the Ingress
  # (annotation) and the HTTPRoute (ExtensionRef filters) in this order:
  # rateLimit, secureHeaders, compression.
  middlewares:
    enabled: false

    rateLimit:
      enabled: true
      # Average requests per period and per source; burst is the absolute peak.
      average: 100
      burst: 200
      period: 1s
      # Defaults to per source IP. Behind another proxy, e.g.:
      #   ipStrategy:
      #     depth: 1
      sourceCriterion: {}

    secureHeaders:
      enabled: true
      browserXssFilter: true
      contentTypeNosniff: true
      frameDeny: true
      referrerPolicy: strict-origin-when-cross-origin
      stsSeconds: 31536000
      stsIncludeSubdomains: true
      stsPreload: false
      contentSecurityPolicy: ""
      permissionsPolicy: ""
      # Merged into spec.headers.
      customResponseHeaders: {}
      customRequestHeaders: {}

    # s3gate only answers with empty redirects, so compression is off by default.
    compression:
      enabled: false
      encodings: ["br", "zstd", "gzip"]
      minResponseBodyBytes: 1024
      includedContentTypes: []
      excludedContentTypes: []

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Spread replicas across nodes. Set to [] to disable; the pod selector is added automatically.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}
tolerations: []
affinity: {}
